[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "nemy-web"
version = "0.1.0"
description = "Local single-PC web pilot for USD Gaussian scene upload, conversion, and viewing"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi==0.150.0",
    "uvicorn[standard]==0.54.0",
    "numpy==2.5.4",
    "usd-core==26.8",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "httpx==0.28.1",
    "pytest-timeout==2.4.0",
]

[project.scripts]
nemy-api = "nemy_web.app:main"
nemy-worker = "nemy_web.worker:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
timeout = 30
filterwarnings = [
    # Starlette 1.9 prefers httpx2; the pinned httpx==0.28.1 is the only
    # client available, and the plan fixes that pin. Suppress the import-time
    # deprecation notice only, so real warnings still surface.
    "ignore:Using `httpx` with `starlette.testclient` is deprecated:starlette.exceptions.StarletteDeprecationWarning",
]
